<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Dereck Mungoriwo | Personal Portfolio</title>
  <desc id="d">Pastry Chef turned IT Professional</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172521"/>
      <stop offset="1" stop-color="#20352f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- two paths converging: culinary (ivory) and IT (gold) -->
  <g fill="none" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M700 330 C 820 330, 840 200, 960 200" stroke="#F5F0E7"/>
