    <path d="M960 200 H 1120" stroke="#C5AA80" stroke-dasharray="2 10"/>
  </g>
  <circle cx="700" cy="330" r="9" fill="#F5F0E7"/>
  <circle cx="700" cy="70" r="9" fill="#C5AA80"/>
  <circle cx="960" cy="200" r="13" fill="#C5AA80"/>
  <circle cx="960" cy="200" r="24" fill="none" stroke="#C5AA80" stroke-opacity=".4" stroke-width="2"/>
  <text x="691" y="366" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F5F0E7" letter-spacing="2">CULINARY</text>
  <text x="691" y="46" font-family="Inter, Arial, sans-serif" font-size="14" fill="#C5AA80" letter-spacing="2">TECHNOLOGY</text>

  <!-- text -->
  <rect x="70" y="108" width="56" height="3" fill="#C5AA80"/>
  <text x="70" y="96" font-family="Inter, Arial, sans-serif" font-size="15" fill="#C5AA80" letter-spacing="4">PERSONAL PORTFOLIO / 2026</text>
  <text x="70" y="190" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F5F0E7">Dereck</text>
  <text x="70" y="262" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F5F0E7">Mungoriwo</text>
  <text x="72" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#C5AA80">Pastry Chef turned IT Professional.</text>
